    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,

    [type=&quot;time&quot;],

  ) {

  .form-check {

  }

  }

  .form-check-input::after {

    left: 50%;
    width: 44px;
    height: 44px;

  }

  .form-check-label {

    height: 44px;

    height: 44px;
  }

  }

svg {

svg.lucide {

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {

}

  &lt;style&gt;
    #fj-peer-explainer {

      gap: 12px;
      margin-bottom: 6px;

    #fj-peer-explainer .fj-layout {

    #fj-peer-explainer .fj-detail { margin-bottom: 12px; }
    #fj-peer-explainer .fj-detail h3,
    #fj-peer-explainer .fj-detail p { margin: 0; }

    #fj-peer-explainer .fj-detail-meta {

    #fj-peer-explainer .fj-lane-head {

      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px 12px;

    #fj-peer-explainer .fj-lane-title { font-weight: 500; }
    #fj-peer-explainer .fj-row {

    #fj-peer-explainer .fj-tile.winner {

    #fj-peer-explainer .fj-tile.loser {

    #fj-peer-explainer .fj-tile.done {
      background: color-mix(in srgb, var(--viz-series-4) 18%, transparent);
    }
    #fj-peer-explainer .fj-arrow { color: var(--muted-foreground); }
    #fj-peer-explainer .fj-pairs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;

    #fj-peer-explainer .fj-pair {

    #fj-peer-explainer .fj-pend {

      border-radius: 8px;

    #fj-peer-explainer .fj-pend.is-active {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    #fj-peer-explainer .fj-pend.is-done { opacity: .42; }
    #fj-peer-explainer .fj-schedule {
      display: inline-grid;
      min-width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 7px;
      background: color-mix(in srgb, var(--foreground) 8%, transparent);
      font-variant-numeric: tabular-nums;
    }
    #fj-peer-explainer .fj-schedule.is-active {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    #fj-peer-explainer .fj-schedule.is-done { opacity: .4; }
    #fj-peer-explainer .fj-code-title { margin: 0 0 6px; }
    #fj-peer-explainer .fj-code {
      margin: 0 0 12px;
      padding: 10px 0 10px 12px;
      border-left: 3px solid var(--primary);
      overflow-x: auto;
      color: var(--foreground);
      background: transparent;
      white-space: pre;
    }
    #fj-peer-explainer .fj-index-map {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 5px 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    #fj-peer-explainer .fj-index-map code { color: var(--foreground); }
    #fj-peer-explainer .fj-empty { color: var(--muted-foreground); }
    #fj-peer-explainer .fj-search-note {
      margin-top: 7px;
      color: var(--muted-foreground);

    @media (max-width: 780px) {
      #fj-peer-explainer .fj-layout { grid-template-columns: 1fr; }
      #fj-peer-explainer .fj-stage { min-height: 280px; }

    @media (max-width: 480px) {
      #fj-peer-explainer .fj-top { align-items: start; flex-direction: column; }
      #fj-peer-explainer .fj-phase-line { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      #fj-peer-explainer .fj-controls .btn { flex: 1; }
      #fj-peer-explainer .fj-tile { min-width: 38px; height: 38px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #fj-peer-explainer * { scroll-behavior: auto !important; }
    }

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;fj-peer-explainer&#x27;);
      if (!root) return;
      const q = selector =&gt; root.querySelector(selector);
      const qa = selector =&gt; Array.from(root.querySelectorAll(selector));
      const inputValues = [22, 8, 20, 2, 24, 14, 21, 5, 23, 9];
      const phaseOrder = [&#x27;pair&#x27;, &#x27;recurse&#x27;, &#x27;chain&#x27;, &#x27;order&#x27;, &#x27;insert&#x27;, &#x27;return&#x27;, &#x27;done&#x27;];
      let events = [];
      let levelInputs = {};
      let comparisons = 0;
      let cursor = 0;
      let timer = null;

      const item = (value, index) =&gt; ({ id: `v${index}`, value, origin: index + 1 });
      const copyItem = value =&gt; value ? { ...value } : null;
      const copyPairs = values =&gt; (values || []).map(pair =&gt; ({ winner: copyItem(pair.winner), loser: copyItem(pair.loser) }));
      const copyPending = values =&gt; (values || []).map(record =&gt; ({ index: record.index, item: copyItem(record.item), partner: copyItem(record.partner), inserted: record.inserted }));

      function emit(data) {
        events.push({
          type: data.type,
          phase: data.phase,
          depth: data.depth,
          title: data.title,
          detail: data.detail,
          comparisons,
          input: (data.input || []).map(copyItem),
          remaining: (data.remaining || []).map(copyItem),
          pairs: copyPairs(data.pairs),
          current: (data.current || []).map(copyItem),
          winners: (data.winners || []).map(copyItem),
          sortedPairs: copyPairs(data.sortedPairs),
          main: (data.main || []).map(copyItem),
          pending: copyPending(data.pending),
          straggler: copyItem(data.straggler),
          schedule: [...(data.schedule || [])],
          schedulePosition: data.schedulePosition ?? -1,
          active: copyItem(data.active),
          partner: copyItem(data.partner),
          bound: data.bound ?? null,
          insertPosition: data.insertPosition ?? null,
          roles: { ...(data.roles || {}) }
        });
      }

      function jacobsthal(n) {
        const sequence = [];
        if (n &lt;= 1) return sequence;
        let previousJacob = 1;
        let currentJacob = 3;
        let previousBoundary = 1;
        while (currentJacob &lt;= n) {
          sequence.push(currentJacob);
          for (let i = currentJacob - 1; i &gt; previousBoundary; --i) sequence.push(i);
          previousBoundary = currentJacob;
          const nextJacob = currentJacob + 2 * previousJacob;
          previousJacob = currentJacob;
          currentJacob = nextJacob;
        }
        for (let i = n; i &gt; previousBoundary; --i) sequence.push(i);
        return sequence;
      }

      function fordJohnson(values, depth) {
        levelInputs[depth] = values.map(copyItem);
        emit({
          type: &#x27;enter&#x27;, phase: &#x27;pair&#x27;, depth, input: values,
          title: `sortingVector(data) enters level ${depth}`,
          detail: depth === 0 ? &#x27;Start with the original vector.&#x27; : &#x27;The previous level passed only its winnersTmp vector.&#x27;
        });

        if (values.length &lt;= 1) {
          emit({
            type: &#x27;base&#x27;, phase: &#x27;return&#x27;, depth, input: values, main: values,
            title: &#x27;Base case: data.size() &lt;= 1&#x27;,
            detail: &#x27;Return this vector. Recursion now unwinds to the caller.&#x27;
          });
          return [...values];
        }

        const completed = [];
        const pairEnd = values.length - values.length % 2;
        const straggler = values.length % 2 ? values[values.length - 1] : null;

        for (let i = 0; i &lt; pairEnd; i += 2) {
          const left = values[i];
          const right = values[i + 1];
          comparisons++;
          emit({
            type: &#x27;compare&#x27;, phase: &#x27;pair&#x27;, depth, input: values,
            remaining: values.slice(i + 2, pairEnd), pairs: completed,
            current: [left, right], straggler,
            title: `Compare ${left.value} and ${right.value}`,
            detail: left.value &lt; right.value
              ? `${left.value} &lt; ${right.value}, so std::swap(a, b) puts the larger value in winner.`
              : `${left.value} ≥ ${right.value}, so no swap is needed.`
          });
          const pair = left.value &lt; right.value
            ? { winner: right, loser: left }
            : { winner: left, loser: right };
          completed.push(pair);
          emit({
            type: &#x27;store&#x27;, phase: &#x27;pair&#x27;, depth, input: values,
            remaining: values.slice(i + 2, pairEnd), pairs: completed,
            straggler,
            title: `Store winner ${pair.winner.value}, loser ${pair.loser.value}`,
            detail: &#x27;The Pairs object is pushed into pairs; an odd final value remains the straggler.&#x27;
          });
        }

        const winners = completed.map(pair =&gt; pair.winner);
        emit({
          type: &#x27;winners&#x27;, phase: &#x27;recurse&#x27;, depth, input: values,
          pairs: completed, winners, straggler,
          title: `Build winners = [${winners.map(x =&gt; x.value).join(&#x27;, &#x27;)}]`,
          detail: &#x27;winnersTmp = winners, then sortingVector(winnersTmp) recursively sorts only these larger values.&#x27;
        });

        emit({
          type: &#x27;call&#x27;, phase: &#x27;recurse&#x27;, depth, input: values,
          pairs: completed, winners, straggler,
          title: `Call sortingVector(winnersTmp) at level ${depth + 1}`,
          detail: &#x27;The winner cards move down and become data in the next recursion level.&#x27;
        });

        const sortedWinners = fordJohnson(winners, depth + 1);
        const pairByWinner = new Map(completed.map(pair =&gt; [pair.winner.id, pair]));
        const sortedPairs = sortedWinners.map(winner =&gt; pairByWinner.get(winner.id));

        emit({
          type: &#x27;returned&#x27;, phase: &#x27;recurse&#x27;, depth, input: values,
          winners: sortedWinners, sortedPairs, straggler,
          title: `winnerSorted returns [${sortedWinners.map(x =&gt; x.value).join(&#x27;, &#x27;)}]`,
          detail: &#x27;Reorder the losers by following their paired winners in this new order.&#x27;
        });

        const roles = {};
        sortedPairs.forEach((pair, index) =&gt; {
          roles[pair.winner.id] = `a${index + 1}`;
          roles[pair.loser.id] = `b${index + 1}`;
        });
        if (straggler) roles[straggler.id] = `b${sortedPairs.length + 1}`;

        let main = [sortedPairs[0].loser, ...sortedWinners];
        const pending = [];
        for (let i = 1; i &lt; sortedPairs.length; ++i) {
          pending.push({ index: i + 1, item: sortedPairs[i].loser, partner: sortedPairs[i].winner, inserted: false });
        }
        if (straggler) pending.push({ index: sortedPairs.length + 1, item: straggler, partner: null, inserted: false });

        emit({
          type: &#x27;chain&#x27;, phase: &#x27;chain&#x27;, depth, input: values,
          sortedPairs, main, pending, straggler, roles,
          title: &#x27;Build main chain: [b₁, a₁, a₂, …]&#x27;,
          detail: &#x27;b₁ is placed first. The other losers become pend and keep their paired-winner boundary.&#x27;
        });

        const logicalCount = sortedPairs.length + (straggler ? 1 : 0);
        const schedule = jacobsthal(logicalCount);
        emit({
          type: &#x27;order&#x27;, phase: &#x27;order&#x27;, depth, input: values,
          sortedPairs, main, pending, straggler, schedule, roles,
          title: `Jacobsthal(${logicalCount}) → ${schedule.join(&#x27;, &#x27;) || &#x27;empty&#x27;}`,
          detail: logicalCount === 5
            ? &#x27;b₁ is already in main. Insert b₃, b₂, b₅, b₄. In a rest-only vector, that is positions 2, 1, 4, 3.&#x27;
            : &#x27;The returned values are original one-based b-indexes; index 1 is omitted because b₁ is already in main.&#x27;
        });

        for (let orderPosition = 0; orderPosition &lt; schedule.length; ++orderPosition) {
          const index = schedule[orderPosition];
          const record = pending.find(value =&gt; value.index === index);
          if (!record) continue;
          const bound = record.partner ? main.findIndex(value =&gt; value.id === record.partner.id) : main.length;
          let low = 0;
          let high = bound;
          while (low &lt; high) {
            const middle = Math.floor((low + high) / 2);
            comparisons++;
            if (main[middle].value &lt; record.item.value) low = middle + 1;
            else high = middle;
          }
          emit({
            type: &#x27;search&#x27;, phase: &#x27;insert&#x27;, depth, input: values,
            sortedPairs, main, pending, straggler, schedule,
            schedulePosition: orderPosition, active: record.item,
            partner: record.partner, bound, insertPosition: low, roles,
            title: `Insert ${roles[record.item.id]} = ${record.item.value}`,
            detail: record.partner
              ? `lower_bound searches only [begin, ${roles[record.partner.id]}) and finds position ${low}.`
              : `The straggler has no partner, so lower_bound searches the whole main chain.`
          });
          main.splice(low, 0, record.item);
          record.inserted = true;
          emit({
            type: &#x27;inserted&#x27;, phase: &#x27;insert&#x27;, depth, input: values,
            sortedPairs, main, pending, straggler, schedule,
            schedulePosition: orderPosition, active: record.item, roles,
            title: `${roles[record.item.id]} is now inside the sorted main chain`,
            detail: &#x27;Continue with the next original b-index in the Jacobsthal schedule.&#x27;
          });
        }

        emit({
          type: &#x27;done&#x27;, phase: depth === 0 ? &#x27;done&#x27; : &#x27;return&#x27;, depth,
          input: values, main, pending, schedule, straggler, roles,
          title: depth === 0 ? `Sorted result: ${main.map(x =&gt; x.value).join(&#x27; &#x27;)}` : `Return ${main.map(x =&gt; x.value).join(&#x27; &#x27;)} to level ${depth - 1}`,
          detail: depth === 0 ? &#x27;Run the same algorithm independently for std::vector and std::deque, then report their processing times.&#x27; : &#x27;This sorted chain becomes winnerSorted in the caller.&#x27;
        });
        return main;
      }

      function tileHTML(value, classes = &#x27;&#x27;, keyPrefix = &#x27;&#x27;, role = &#x27;&#x27;) {
        const label = role || &#x27;&#x27;;
        return `&lt;span class=&quot;fj-tile ${classes}&quot; data-key=&quot;${keyPrefix}${value.id}&quot; aria-label=&quot;${label ? label + &#x27;, &#x27; : &#x27;&#x27;}value ${value.value}&quot;&gt;${value.value}${label ? `&lt;small&gt;${label}&lt;/small&gt;` : &#x27;&#x27;}&lt;/span&gt;`;
      }

      function laneHTML(title, hint, content) {
        return `&lt;section class=&quot;fj-lane&quot;&gt;&lt;div class=&quot;fj-lane-head&quot;&gt;&lt;span class=&quot;fj-lane-title&quot;&gt;${title}&lt;/span&gt;&lt;code class=&quot;text-small text-muted&quot;&gt;${hint}&lt;/code&gt;&lt;/div&gt;&lt;div class=&quot;fj-row&quot;&gt;${content || &#x27;&lt;span class=&quot;fj-empty text-small&quot;&gt;empty&lt;/span&gt;&#x27;}&lt;/div&gt;&lt;/section&gt;`;
      }

      function pairsHTML(event) {
        const stored = event.pairs.map((pair, index) =&gt; `&lt;div class=&quot;fj-pair&quot;&gt;&lt;span class=&quot;fj-pair-label text-small&quot;&gt;P${index + 1}&lt;/span&gt;${tileHTML(pair.winner, &#x27;winner&#x27;)}&lt;span class=&quot;fj-arrow&quot;&gt;≥&lt;/span&gt;${tileHTML(pair.loser, &#x27;loser&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;);
        const current = event.current.length === 2
          ? `&lt;div class=&quot;fj-pair&quot;&gt;${tileHTML(event.current[0], &#x27;active&#x27;)}&lt;span class=&quot;fj-arrow&quot;&gt;?&lt;/span&gt;${tileHTML(event.current[1], &#x27;active&#x27;)}&lt;/div&gt;`
          : &#x27;&#x27;;
        return stored + current;
      }

      function renderStage(event) {
        let html = &#x27;&#x27;;
        if (event.type === &#x27;enter&#x27;) {
          html = laneHTML(&#x27;data&#x27;, &#x27;sortingVector(data)&#x27;, event.input.map(value =&gt; tileHTML(value)).join(&#x27;&#x27;));
        } else if (event.type === &#x27;base&#x27;) {
          html = laneHTML(&#x27;base case&#x27;, &#x27;return data&#x27;, event.main.map(value =&gt; tileHTML(value, &#x27;done&#x27;)).join(&#x27;&#x27;));
        } else if (event.type === &#x27;compare&#x27; || event.type === &#x27;store&#x27;) {
          if (event.remaining.length) html += laneHTML(&#x27;unprocessed data&#x27;, &#x27;data[i], data[i + 1]&#x27;, event.remaining.map(value =&gt; tileHTML(value)).join(&#x27;&#x27;));
          html += laneHTML(&#x27;normalized pairs&#x27;, &#x27;winner ≥ loser&#x27;, `&lt;div class=&quot;fj-pairs&quot;&gt;${pairsHTML(event)}&lt;/div&gt;`);
          if (event.straggler) html += laneHTML(&#x27;straggler&#x27;, &#x27;data.back()&#x27;, tileHTML(event.straggler, &#x27;straggler&#x27;));
        } else if (event.type === &#x27;winners&#x27; || event.type === &#x27;call&#x27;) {
          html += laneHTML(event.type === &#x27;call&#x27; ? &#x27;winnersTmp enters recursion&#x27; : &#x27;winners&#x27;, event.type === &#x27;call&#x27; ? &#x27;sortingVector(winnersTmp)&#x27; : &#x27;winners.push_back(pair.winner)&#x27;, event.winners.map(value =&gt; tileHTML(value, &#x27;winner&#x27;)).join(&#x27;&#x27;));
          const losers = event.pairs.map(pair =&gt; pair.loser);
          html += laneHTML(&#x27;losers stay at this level&#x27;, &#x27;pairs[i].loser&#x27;, losers.map(value =&gt; tileHTML(value, &#x27;loser&#x27;)).join(&#x27;&#x27;));
          if (event.straggler) html += laneHTML(&#x27;straggler stays at this level&#x27;, &#x27;not in winnersTmp&#x27;, tileHTML(event.straggler, &#x27;straggler&#x27;));
        } else if (event.type === &#x27;returned&#x27;) {
          html += laneHTML(&#x27;winnerSorted&#x27;, &#x27;sortingVector(winnersTmp) returned&#x27;, event.winners.map((value, index) =&gt; tileHTML(value, &#x27;winner done&#x27;, &#x27;&#x27;, `a${index + 1}`)).join(&#x27;&#x27;));
          html += laneHTML(&#x27;reordered losers&#x27;, &#x27;follow each sorted winner&#x27;, event.sortedPairs.map((pair, index) =&gt; tileHTML(pair.loser, &#x27;loser&#x27;, &#x27;&#x27;, `b${index + 1}`)).join(&#x27;&#x27;));
        } else {
          const mainContent = event.main.map((value, index) =&gt; {
            let classes = event.type === &#x27;done&#x27; ? &#x27;done&#x27; : &#x27;&#x27;;
            if (event.active &amp;&amp; value.id === event.active.id) classes += &#x27; active&#x27;;
            if (event.type === &#x27;search&#x27; &amp;&amp; event.bound !== null) {
              if (index &lt; event.bound) classes += &#x27; searchable&#x27;;
              else if (index === event.bound &amp;&amp; event.partner) classes += &#x27; partner&#x27;;
              else classes += &#x27; outside&#x27;;
            }
            return tileHTML(value, classes, &#x27;&#x27;, event.roles[value.id]);
          }).join(&#x27;&lt;span class=&quot;fj-arrow&quot;&gt;→&lt;/span&gt;&#x27;);
          html += laneHTML(&#x27;main chain&#x27;, &#x27;sorted at every step&#x27;, mainContent);
          if (event.pending.length) {
            const pendContent = event.pending.map(record =&gt; `&lt;span class=&quot;fj-pend${record.inserted ? &#x27; is-done&#x27; : &#x27;&#x27;}${event.active &amp;&amp; event.active.id === record.item.id ? &#x27; is-active&#x27; : &#x27;&#x27;}&quot;&gt;&lt;code&gt;b${record.index}&lt;/code&gt;${record.item.value}&lt;span class=&quot;text-small&quot;&gt;→ ${record.partner ? `a${record.index}` : &#x27;end&#x27;}&lt;/span&gt;&lt;/span&gt;`).join(&#x27;&#x27;);
            html += laneHTML(&#x27;pend&#x27;, &#x27;loser → paired winner bound&#x27;, pendContent);
          }
          if (event.schedule.length) {
            const scheduleContent = event.schedule.map((value, index) =&gt; `&lt;span class=&quot;fj-schedule${index &lt; event.schedulePosition ? &#x27; is-done&#x27; : &#x27;&#x27;}${index === event.schedulePosition ? &#x27; is-active&#x27; : &#x27;&#x27;}&quot;&gt;${value}&lt;/span&gt;`).join(&#x27;&lt;span class=&quot;fj-arrow&quot;&gt;→&lt;/span&gt;&#x27;);
            html += laneHTML(&#x27;Jacobsthal order&#x27;, &#x27;original one-based b-indexes&#x27;, scheduleContent);
          }
          if (event.type === &#x27;search&#x27;) {
            html += `&lt;div class=&quot;fj-search-note text-small&quot;&gt;Search range: positions 0…${Math.max(0, event.bound - 1)} · insertion position: ${event.insertPosition}&lt;/div&gt;`;
          }
        }
        q(&#x27;#fj-stage&#x27;).innerHTML = html;
      }

      function currentCode(event) {
        const snippets = {
          enter: `if (data.size() &lt;= 1)\n    return data;`,
          base: `if (data.size() &lt;= 1)\n    return data;`,
          compare: `int a = data[i];\nint b = data[i + 1];\nif (a &lt; b)\n    std::swap(a, b);`,
          store: `pair.winner = a;\npair.loser = b;\npairs.push_back(pair);`,
          winners: `for (size_t i = 0; i &lt; pairs.size(); ++i)\n    winners.push_back(pairs[i].winner);\n\nwinnersTmp = winners;`,
          call: `winnerSorted = sortingVector(winnersTmp);`,
          returned: `if (winners[j] == winnerSorted[i] &amp;&amp; !used[j])\n{\n    reorderLoser[i] = pairs[j].loser;\n    used[j] = true;\n}`,
          chain: `mainChain.push_back(reorderedLosers[0]);\nfor (...)\n    mainChain.push_back(winnerSorted[i]);`,
          order: `std::vector&lt;size_t&gt; order =\n    Jacobsthal(pendingCount);`,
          search: `bound = mainChain.begin();\nstd::advance(bound, partnerPositions[j]);\nposition = std::lower_bound(\n    mainChain.begin(), bound, value);`,
          inserted: `mainChain.insert(position, value);`,
          done: `return mainChain;`
        };
        return snippets[event.type] || snippets.done;
      }

      function captureRects() {
        const result = new Map();
        qa(&#x27;.fj-tile[data-key]&#x27;).forEach(node =&gt; result.set(node.dataset.key, node.getBoundingClientRect()));
        return result;
      }

      function animateCards(previous) {
        if (window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches) return;
        qa(&#x27;.fj-tile[data-key]&#x27;).forEach(node =&gt; {
          const before = previous.get(node.dataset.key);
          if (!before) return;
          const after = node.getBoundingClientRect();
          const dx = before.left - after.left;
          const dy = before.top - after.top;
          if (Math.abs(dx) &lt; 1 &amp;&amp; Math.abs(dy) &lt; 1) return;
          node.animate([
            { transform: `translate(${dx}px, ${dy}px) scale(1.05)`, zIndex: 20 },
            { transform: &#x27;translate(0, 0) scale(1)&#x27;, zIndex: 1 }
          ], { duration: 560, easing: &#x27;cubic-bezier(.2,.8,.2,1)&#x27; });
        });
      }

      function renderRecursion(depth) {
        const depths = Object.keys(levelInputs).map(Number).sort((a, b) =&gt; a - b);
        q(&#x27;#fj-recursion&#x27;).innerHTML = depths.map((value, index) =&gt; {
          const values = levelInputs[value].map(entry =&gt; entry.value).join(&#x27; &#x27;);
          return `${index ? &#x27;&lt;span class=&quot;fj-arrow&quot;&gt;→&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;span class=&quot;fj-level${value === depth ? &#x27; is-active&#x27; : &#x27;&#x27;}&quot;&gt;L${value}: ${values}&lt;/span&gt;`;
        }).join(&#x27;&#x27;);
      }

      function render(animate = true) {
        const previous = animate ? captureRects() : new Map();
        const event = events[cursor];
        const percent = events.length &lt;= 1 ? 100 : Math.round(cursor / (events.length - 1) * 100);
        q(&#x27;#fj-event-label&#x27;).textContent = event.phase;
        q(&#x27;#fj-event-title&#x27;).textContent = event.title;
        q(&#x27;#fj-event-detail&#x27;).textContent = event.detail;
        q(&#x27;#fj-depth&#x27;).textContent = event.depth;
        q(&#x27;#fj-comparisons&#x27;).textContent = event.comparisons;
        q(&#x27;#fj-progress-label&#x27;).textContent = `Step ${cursor + 1} of ${events.length}`;
        q(&#x27;#fj-progress-value&#x27;).textContent = `${percent}%`;
        q(&#x27;#fj-progress-bar&#x27;).style.width = `${percent}%`;
        q(&#x27;#fj-progress-bar&#x27;).parentElement.setAttribute(&#x27;aria-valuenow&#x27;, String(percent));
        q(&#x27;#fj-code&#x27;).textContent = currentCode(event);
        q(&#x27;#fj-prev&#x27;).disabled = cursor === 0;
        q(&#x27;#fj-next&#x27;).disabled = cursor === events.length - 1;
        qa(&#x27;.fj-phase&#x27;).forEach(node =&gt; node.classList.toggle(&#x27;is-active&#x27;, node.dataset.phase === event.phase));
        renderRecursion(event.depth);
        renderStage(event);
        requestAnimationFrame(() =&gt; animateCards(previous));
      }

      function stop() {
        if (timer) window.clearInterval(timer);
        timer = null;
        q(&#x27;#fj-play&#x27;).textContent = &#x27;▶ Play&#x27;;
        q(&#x27;#fj-play&#x27;).setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
      }

      q(&#x27;#fj-prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        stop();
        if (cursor &gt; 0) { cursor--; render(); }
      });
      q(&#x27;#fj-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        stop();
        if (cursor &lt; events.length - 1) { cursor++; render(); }
      });
      q(&#x27;#fj-reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        stop();
        cursor = 0;
        render();
      });
      q(&#x27;#fj-play&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        if (timer) { stop(); return; }
        if (cursor === events.length - 1) cursor = 0;
        q(&#x27;#fj-play&#x27;).textContent = &#x27;Ⅱ Pause&#x27;;
        q(&#x27;#fj-play&#x27;).setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
        render();
        timer = window.setInterval(() =&gt; {
          if (cursor &gt;= events.length - 1) { stop(); return; }
          cursor++;
          render();
        }, 980);
      });

      comparisons = 0;
      events = [];
      levelInputs = {};
      fordJohnson(inputValues.map(item), 0);
      render(false);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {

  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
